# Wydanie: po wypchnięciu tagu v* (np. v0.6.1) buduje instalator i wersję portable na Windowsie
# i publikuje je jako wydanie na GitHubie. Z tego wydania aplikacja pobiera aktualizacje.
name: Wydanie
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Testy zgłoszonych buildów
        run: npm run test:reports
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Opis wydania
        run: gh release edit $env:GITHUB_REF_NAME --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
